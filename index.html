let favs=JSON.parse(localStorage.getItem("favs")||"[]"),custom=JSON.parse(localStorage.getItem("custom")||"[]"),states=JSON.parse(localStorage.getItem("states")||"{}");
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawSections(){ $("sections").innerHTML=DATA.map((s,i)=>`<div class="section" onclick="openSec(${i})"><h3>${esc(s.name)}</h3><small>${s.items.length} عنصر</small></div>`).join("")}
function openSec(i){$("home").classList.add("hidden");$("searchPage").classList.add("hidden");$("reader").classList.remove("hidden");$("st").textContent=DATA[i].name;$("cards").innerHTML=DATA[i].items.map((x,j)=>card(x,`d-${i}-${j}`)).join("");updateProgress()}
function card(x,id){let max=parseInt(x.count)||0,n=states[id]||0,done=max&&n>=max;return `<article class="card" data-id="${id}"><div class="head"><h3>${esc(x.title)}</h3><button class="fav" onclick="fav(event,'${id}')">${favs.includes(id)?"★":"☆"}</button></div><div class="dhikr">${esc(x.text)}</div><div class="source">${esc(x.source)}</div>${max?`<div class="actions"><button class="tap" ${done?"disabled":""} onclick="tap('${id}',this,${max})">${done?"تمّ ✓":"اضغط للذكر"}</button><span class="num">${n} / ${max}</span><button class="reset" onclick="rst('${id}')">↺</button></div>`:`<div class="note">هذا العنصر لا يحتاج عدّادًا محددًا.</div>`}</article>`}
function tap(id,b,max){let n=Math.min((states[id]||0)+1,max);states[id]=n;localStorage.setItem("states",JSON.stringify(states));let el=b.parentElement.querySelector(".num");el.textContent=n+" / "+max;if(n>=max){b.textContent="تمّ ✓";b.disabled=true}updateProgress()}
function rst(id){delete states[id];localStorage.setItem("states",JSON.stringify(states));let el=document.querySelector(`[data-id="${id}"]`);if(el){let i=DATA.flatMap((s,si)=>s.items.map((x,j)=>({x,si,j}))).find(o=>`d-${o.si}-${o.j}`===id);el.outerHTML=card(i.x,id)}updateProgress()}
function updateProgress(){let cards=[...document.querySelectorAll("#cards .card")];if(!cards.length)return;let done=cards.filter(c=>{let b=c.querySelector(".tap");return b&&b.disabled}).length;$("progress").textContent=Math.round(done/cards.length*100)+"%"}
function fav(e,id){e.stopPropagation();favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem("favs",JSON.stringify(favs));e.currentTarget.textContent=favs.includes(id)?"★":"☆"}
function favorites(){let out=[];DATA.forEach((s,i)=>s.items.forEach((x,j)=>{if(favs.includes(`d-${i}-${j}`))out.push({...x,id:`d-${i}-${j}`,sec:s.name})}));showList("المفضلة",out)}
function search(){let q=$("search").value.trim();if(!q){home();return}let out=[];DATA.forEach((s,i)=>s.items.forEach((x,j)=>{if((s.name+x.title+x.text+x.source).includes(q))out.push({...x,id:`d-${i}-${j}`,sec:s.name})}));showList("نتائج البحث",out)}
function showList(title,out){$("home").classList.add("hidden");$("reader").classList.add("hidden");$("searchPage").classList.remove("hidden");$("searchPage").querySelector("h2").textContent=title;$("results").innerHTML=out.length?out.map(x=>`<article class="card"><div class="source">${esc(x.sec)}</div><h3>${esc(x.title)}</h3><div class="dhikr">${esc(x.text)}</div><div class="source">${esc(x.source)}</div></article>`).join(""):"<p>لا توجد نتائج.</p>"}
function customAdd(){let title=prompt("اسم الذكر أو الدعاء");if(!title)return;let text=prompt("النص");if(!text)return;custom.push({title,text});localStorage.setItem("custom",JSON.stringify(custom));alert("تم الحفظ على هذا الجهاز.")}
function resetAll(){states={};localStorage.setItem("states","{}");alert("تم تصفير العدادات.");}
function home(){$("reader").classList.add("hidden");$("searchPage").classList.add("hidden");$("home").classList.remove("hidden");$("search").value=""}
function dark(){document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark")?"1":"0")}
if(localStorage.getItem("dark")==="1")document.body.classList.add("dark");drawSections();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
